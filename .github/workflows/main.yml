name: Auto Run Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # chạy mỗi 5 phút (có thể sửa)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show files (debug)
        run: ls -R

      - name: Run Bot
        run: python bot.py
